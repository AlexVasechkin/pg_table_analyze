[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pgcollect"
version = "0.1.0"
description = "Сбор метаданных PostgreSQL-кластера (14+) и генерация документации (HTML + Confluence)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
    "typer>=0.12",
]

[project.scripts]
pgcollect = "pgcollect.cli:app"
pgservercollect = "pgservercollect.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pgcollect", "src/pgservercollect"]
