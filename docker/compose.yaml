# Тестовый кластер для проверки pgcollect.
# Поднимает postgres:16 и заливает фикстуру (docker/fixture.sql):
# несколько схем, партиционированная таблица, роли+группы с грантами,
# «раздутая» таблица и таблица с устаревшей статистикой.
services:
  postgres:
    image: postgres:16
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - wal_level=logical
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./fixture.sql:/docker-entrypoint-initdb.d/10-fixture.sql:ro
