# Реестр целей сбора (кластеров PostgreSQL). Один элемент targets — один кластер.
# Секреты (пароль) в файл НЕ пишем: берём из переменной окружения password_env
# или из ~/.pgpass. Файл targets.yaml можно держать под контролем версий без риска.

targets:
  # Локальный тестовый кластер (docker compose из docker/compose.yaml).
  - name: local
    title: "Локальный тестовый PostgreSQL 16"
    host: 127.0.0.1
    port: 5432
    # Учётка read-only: суперпользователь ЛИБО роль с pg_monitor + CONNECT на нужные БД.
    user: postgres
    password_env: PGCOLLECT_PASSWORD   # имя переменной окружения с паролем (опц.)
    # БД для первичного подключения (из неё перечисляем остальные через pg_database).
    maintenance_db: postgres
    sslmode: prefer

    # Ограничения безопасности сессии (применяются к каждому подключению).
    statement_timeout_ms: 30000
    lock_timeout_ms: 3000

    # Какие БД собирать. Если databases не задан — обходим все пользовательские
    # (кроме template-БД и БД с datallowconn=false). include/exclude — glob-маски.
    # databases: [billing, analytics]
    exclude_databases: [postgres]

    # Пороги статусов (ok/warn/crit). Значения по умолчанию — в config.py.
    thresholds:
      bloat_warn_pct: 20
      bloat_crit_pct: 40
      dead_tuple_warn_pct: 10
      dead_tuple_crit_pct: 20
      # Порог размера объекта (МБ), выше которого точный pgstattuple НЕ вызывается
      # без флага --deep-bloat (чтобы не сканировать большие таблицы на prod).
      pgstattuple_max_mb: 512

    # --- Только для pgservercollect (таблица оптимизации конфига) --------------
    # pgcollect эти блоки игнорирует. PostgreSQL по SQL не знает RAM/CPU/тип диска,
    # поэтому железо задаётся вручную — иначе числовые рекомендации остаются
    # формулой-ориентиром.
    #
    # Профиль нагрузки — общий для кластера.
    workload:
      kind: oltp                 # oltp | olap | mixed
      # Ожидаемое число ОДНОВРЕМЕННЫХ соединений (НЕ max_connections). От него, а не
      # от завышенного max_connections, считается work_mem = ~25% RAM / connections.
      connections: 100
    #
    # Железо ПО КАЖДОМУ узлу кластера. Рекомендации тюнинга считаются от ресурсов
    # узла с role: leader (в кластере конфиг единый, его задаёт primary), независимо
    # от того, к какому узлу подключились. Пометьте leader-узел role: leader.
    nodes:
      - name: pg1
        role: leader              # leader | replica
        cpu: 8                    # число ядер
        mem: 16GB                 # "16GB" / "16384MB" / 16384 (число = МБ)
        disk_type: ssd            # ssd | hdd | nvme
      - name: pg2
        role: replica
        cpu: 8
        mem: 16GB
        disk_type: ssd
      - name: pg3
        role: replica
        cpu: 4
        mem: 8GB
        disk_type: hdd
    #
    # Альтернатива для одиночного (не кластерного) сервера — один блок hardware:
    # hardware:
    #   total_ram_mb: 16384
    #   cpu_count: 8
    #   storage_type: ssd
